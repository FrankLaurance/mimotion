name: 刷步数-第二组

on:
  schedule:
    - cron: '3 8 * * *'
  workflow_dispatch:

# 两组任务共用写入队列，避免同时更新登录缓存。
concurrency:
  group: mimotion-token-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG_2 }}
            AES_KEY: ${{ secrets.AES_KEY }}
            TOKEN_FILE: encrypted_tokens_2.data
        run: |
          if [ -z "$CONFIG" ]; then
            echo "::error::请先在仓库 Actions secrets 中设置 CONFIG_2"
            exit 1
          fi
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          if [ ! -f encrypted_tokens_2.data ]; then
            exit 0
          fi
          git add -- encrypted_tokens_2.data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "persist second account tokens trigger by ${{ github.event_name }}"
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
